<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Certificados Básicos</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:20px;
}

.panel{
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,.1);
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input, textarea, select{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
    font-size:14px;
}

textarea{
    min-height:100px;
}

button{
    margin-top:15px;
    padding:10px 15px;
    cursor:pointer;
}

#resultado{
    min-height:700px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>Generador de Certificado Básico</h1>

<div class="container">

<div class="panel">

<label>N° Certificado</label>
<input id="certificado" value="56">

<label>Zona</label>
<input id="zona" value="Z1">

<label>Mes</label>
<input id="mes" value="MAYO">

<label>Año</label>
<input id="anio" value="2026">

<label>Expediente</label>
<input id="expediente" value="EX-2026-26108056--GCABA-DGSPLU">

<label>IF Certificado</label>
<input id="ifCertificado" value="IF-2026-26568558-GCABA-DGSPLU">

<label>IF SAP</label>
<input id="ifSAP" value="IF-2026-26531480-GCABA-DGSPLU">

<label>Contratista</label>
<select id="contratista" onchange="actualizarZona()">
    <option value="Soluciones Químicas S.A., OS.LO. Argentina S.A., Mantelectric I.C.I.S.A. U.T." data-zona="Z1" selected>
        Z1 - Soluciones Químicas S.A., OS.LO. Argentina S.A., Mantelectric I.C.I.S.A. U.T.
    </option>
    <option value="Reconstrucción Caños S.A." data-zona="Z2">
        Z2 - Reconstrucción Caños S.A.
    </option>
    <option value="Automat Argentina S.A." data-zona="Z3">
        Z3 - Automat Argentina S.A.
    </option>
    <option value="DESOBSTRUCTORA ARGENTINA S.A.-ASHIRA S.A. - U.T." data-zona="Z4">
        Z4 - DESOBSTRUCTORA ARGENTINA S.A.-ASHIRA S.A. - U.T.
    </option>
    <option value="ALEMARSA S.A.-SACH S.A.- MANTENIMIENTOS AMBIENTALES S.A. - U.T." data-zona="Z5">
        Z5 - ALEMARSA S.A.-SACH S.A.- MANTENIMIENTOS AMBIENTALES S.A. - U.T.
    </option>
</select>

<label>Monto Certificado (Letras)</label>
<textarea id="montoCertificadoLetras">PESOS VEINTINUEVE MILLONES CIENTO DIEZ MIL QUINIENTOS TREINTA CON 41/100</textarea>

<label>Monto Certificado (Número)</label>
<input id="montoCertificadoNumero" value="$29.110.530,41">

<label>Monto Redeterminaciones (Letras)</label>
<textarea id="montoRedetLetras">PESOS CUATROCIENTOS OCHENTA Y TRES MILLONES SETECIENTOS NOVENTA Y OCHO MIL CIENTO CINCUENTA Y DOS CON 72/100</textarea>

<label>Monto Redeterminaciones (Número)</label>
<input id="montoRedetNumero" value="$483.798.152,72">

<label>Resoluciones</label>
<textarea id="resoluciones" style="height:180px;">
5757-MHFGC/21, 440-MHFGC/22, 2377-MHFGC/22, 3009-MHFGC/22, 4375-MHFGC/22
</textarea>

<button onclick="generarTexto()">Generar Texto</button>
<button onclick="copiarTexto()">Copiar Texto</button>

</div>

<div class="panel">
<h3>Vista Previa</h3>
<div id="resultado"></div>
</div>

</div>

<script>

function actualizarZona(){
    const select = document.getElementById("contratista");
    const zona = select.options[select.selectedIndex].dataset.zona;
    document.getElementById("zona").value = zona;
}

function generarTexto(){

const certificado = document.getElementById("certificado").value;
const zona = document.getElementById("zona").value;
const mes = document.getElementById("mes").value.toUpperCase();
const anio = document.getElementById("anio").value;

const expediente = document.getElementById("expediente").value;

const ifCertificado = document.getElementById("ifCertificado").value;
const ifSAP = document.getElementById("ifSAP").value;

const contratista = document.getElementById("contratista").value;

const montoCertificadoLetras = document.getElementById("montoCertificadoLetras").value;
const montoCertificadoNumero = document.getElementById("montoCertificadoNumero").value;

const montoRedetLetras = document.getElementById("montoRedetLetras").value;
const montoRedetNumero = document.getElementById("montoRedetNumero").value;

const resoluciones = document.getElementById("resoluciones").value;

const texto = `Referencia: S/CERTIFICADO BÁSICO N.° ${certificado} ${zona} ${mes} ${anio}
${expediente}

DIRECCIÓN GENERAL SISTEMA PLUVIAL
DIRECTORA GENERAL
Arq. Gimena De Franco

Por las presentes actuaciones tramita el Certificado Básico N.° ${certificado} (${ifCertificado}), correspondiente a los trabajos realizados durante el mes de ${mes.toLowerCase()} de ${anio} por la empresa ${contratista}, por un monto de ${montoCertificadoLetras} (${montoCertificadoNumero}), correspondiente al servicio básico de Mantenimiento Integral de la Red Pluvial.

Asimismo, mediante las Resoluciones Nros. ${resoluciones}, se aprobaron las redeterminaciones provisorias de precios por un total de ${montoRedetLetras} (${montoRedetNumero}), correspondientes al servicio de Mantenimiento Integral de la Red Pluvial.

Se informa que los montos mencionados surgen del detalle de liquidación emitido por el sistema SAP, vinculado al expediente de referencia mediante el ${ifSAP}.

Asimismo, durante el período se efectuó la verificación y el control de las tareas ejecutadas, de conformidad con los Planes de Mantenimiento desarrollados por la empresa contratista, en cumplimiento de lo establecido en el Pliego de Condiciones Técnicas y las reglas del buen arte.

De acuerdo con las responsabilidades primarias establecidas en el Decreto N.° 387-GCABA/23, modificado por el Decreto N.° 144-GCABA-AJG/26, se elevan las presentes actuaciones a su consideración, toda vez que la materia tratada se encuentra comprendida dentro de las misiones y funciones de esa repartición.

Atento a lo expuesto, esta Gerencia Operativa presta conformidad al Certificado de referencia.

En consecuencia, se remiten las presentes actuaciones para la prosecución de su trámite.

Sin otro particular, saludo a Ud. atentamente.`;

document.getElementById("resultado").innerText = texto;

}

function copiarTexto(){

const texto = document.getElementById("resultado").innerText;

navigator.clipboard.writeText(texto);

alert("Texto copiado al portapapeles");

}

actualizarZona();
generarTexto();

</script>

</body>
</html>
